  <text x="330" y="408" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle">Free + Pro</text>
  <rect x="440" y="380" width="220" height="44" rx="8" fill="#6366f1" opacity="0.2"/>
  <text x="550" y="408" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle">Auto-repricing</text>
