  <text x="240" y="220" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="700" fill="#f1f5f9">Competitor Price &amp; Stock Monitor</text>
  <text x="240" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="400" fill="#94a3b8">for WooCommerce</text>
  <text x="240" y="350" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#64748b">Know when a competitor reprices or goes out of stock — and act first.</text>
  <!-- Badges -->
